<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Shared Lumina Album</title><style>body{margin:0;background:#111;color:#eee;font:14px system-ui}header{padding:24px;position:sticky;top:0;background:#111e;backdrop-filter:blur(10px);z-index:2}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px;padding:8px}figure{margin:0;background:#191919}img{width:100%;display:block}figcaption{padding:10px}.actions{display:flex;gap:8px;align-items:center}button,input{font:inherit;padding:8px;border-radius:6px;border:1px solid #444;background:#222;color:#eee}.comments{padding:24px;max-width:700px}.comment{border-top:1px solid #333;padding:10px 0}</style></head><body><header><h1 id="title">Shared album</h1><div class="actions"><button id="like">♥ Like <span id="likes"></span></button><label id="contributeLabel" hidden>Contribute photos <input id="contribute" type="file" multiple accept="image/*"></label></div></header><main class="grid" id="grid"></main><section class="comments"><h2>Comments</h2><input id="name" placeholder="Your name"><input id="text" placeholder="Write a comment"><button id="send">Post</button><div id="comments"></div></section><script>
const token=new URLSearchParams(location.search).get('token');const q=s=>document.querySelector(s);async function api(u,o={}){const r=await fetch(u,o);if(!r.ok)throw new Error((await r.json()).error);return r.json()}async function load(){const d=await api('/api/share/'+token);q('#title').textContent=d.album?.name||'Shared album';q('#likes').textContent=d.share.likes||0;q('#contributeLabel').hidden=!d.share.allowContribute;q('#grid').innerHTML=d.photos.map(p=>`<figure><img src="${p.preview}"><figcaption>${p.title||p.caption||p.name}${p.original?` · <a href="${p.original}" style="color:#8ab4ff">Download</a>`:''}</figcaption></figure>`).join('');q('#comments').innerHTML=(d.share.comments||[]).map(c=>`<div class="comment"><b>${c.name}</b> ${c.text}</div>`).join('')}q('#like').onclick=async()=>{const d=await api('/api/share/'+token+'/like',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});q('#likes').textContent=d.likes};q('#send').onclick=async()=>{await api('/api/share/'+token+'/comment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:q('#name').value,text:q('#text').value})});q('#text').value='';load()};q('#contribute').onchange=async e=>{const f=new FormData();[...e.target.files].forEach(x=>f.append('photos',x));await api('/api/share/'+token+'/contribute',{method:'POST',body:f});load()};load();
</script></body></html>
