services:
  - type: web
    name: lumina-photo-editor-ai
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATA_DIR
        value: /tmp/lumina-data
      - key: PYTHON_BIN
        value: /opt/venv/bin/python
      - key: HF_HOME
        value: /tmp/lumina-data/models/huggingface
      - key: TRANSFORMERS_CACHE
        value: /tmp/lumina-data/models/huggingface
      - key: TORCH_HOME
        value: /tmp/lumina-data/models/torch
